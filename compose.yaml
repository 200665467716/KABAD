# Full KABAD stack on one server: PostgreSQL, migrations, web app, realtime service.
# Secrets come from a .env file next to this one (never committed): see .env.example.
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kabad
      POSTGRES_DB: kabad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabad -d kabad"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://kabad:${POSTGRES_PASSWORD}@db:5432/kabad
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:?NEXT_PUBLIC_REALTIME_URL manquant}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kabad:${POSTGRES_PASSWORD}@db:5432/kabad
      REALTIME_SECRET: ${REALTIME_SECRET:?REALTIME_SECRET manquant}
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  realtime:
    build: { context: ., target: realtime }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kabad:${POSTGRES_PASSWORD}@db:5432/kabad
      REALTIME_SECRET: ${REALTIME_SECRET}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:?REALTIME_ALLOWED_ORIGINS manquant}
      REALTIME_PORT: 4001
    ports: ["4001:4001"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  db-data:
