name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: Playwright 1.56 installs its system libraries on Ubuntu 24.04, not yet on 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kabad
          POSTGRES_PASSWORD: kabad
          POSTGRES_DB: kabad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kabad" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kabad:kabad@127.0.0.1:5432/kabad
      DATABASE_URL_TEST: postgresql://kabad:kabad@127.0.0.1:5432/kabad_test
      # Throwaway value for the CI database only; production secrets live on the server.
      REALTIME_SECRET: ci-only-realtime-secret-0123456789abcdef
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:4001
      APP_URL: http://127.0.0.1:3100
      TRUSTED_PROXY_HOPS: 0
      # LiveKit started in development mode for the voice room tests (keys devkey / secret).
      LIVEKIT_URL: http://127.0.0.1:7880
      NEXT_PUBLIC_LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LIVEKIT_BIN: ${{ github.workspace }}/.livekit/livekit-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Licences (aucune GPL, AGPL ou LGPL)
        run: npm run licenses
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tests d’intégration (PostgreSQL)
        run: |
          PGPASSWORD=kabad psql -h 127.0.0.1 -U kabad -d kabad -c "CREATE DATABASE kabad_test"
          npm run test:integration
      - run: npm run build
      - name: Navigateur pour les tests de parcours
        run: npx playwright install --with-deps chromium
      - name: Serveur audio LiveKit pour les salons vocaux (Apache-2.0)
        run: |
          mkdir -p .livekit
          curl -sSL -o .livekit/lk.tgz https://github.com/livekit/livekit/releases/download/v1.13.10/livekit_1.13.10_linux_amd64.tar.gz
          echo "c25a3e45fb922e9a93c6443d10c0ed041ba64342097e38632331736630283165  .livekit/lk.tgz" | sha256sum -c -
          tar -xzf .livekit/lk.tgz -C .livekit
      - name: Tests de parcours (écrans, parcours, messagerie en temps réel, salons vocaux)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
