name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: Playwright 1.56 installs its system libraries on Ubuntu 24.04, not yet on 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kabad
          POSTGRES_PASSWORD: kabad
          POSTGRES_DB: kabad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kabad" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kabad:kabad@127.0.0.1:5432/kabad
      DATABASE_URL_TEST: postgresql://kabad:kabad@127.0.0.1:5432/kabad_test
      # Throwaway value for the CI database only; production secrets live on the server.
      REALTIME_SECRET: ci-only-realtime-secret-0123456789abcdef
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:4001
      APP_URL: http://127.0.0.1:3100
      TRUSTED_PROXY_HOPS: 0
      # Voice rooms are switched off for the CADEV: no LiveKit server here. To test them again,
      # set NEXT_PUBLIC_SALONS=on, the LIVEKIT_* values and download livekit-server (see git history).
      NEXT_PUBLIC_SALONS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Licences (aucune GPL, AGPL ou LGPL)
        run: npm run licenses
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tests d’intégration (PostgreSQL)
        run: |
          PGPASSWORD=kabad psql -h 127.0.0.1 -U kabad -d kabad -c "CREATE DATABASE kabad_test"
          npm run test:integration
      - run: npm run build
      - name: Navigateur pour les tests de parcours
        run: npx playwright install --with-deps chromium
      - name: Tests de parcours (écrans, parcours, messagerie en temps réel)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # Builds the three images and publishes them on GitHub Packages, only when every check passed and only
  # for the main branch: a failing test blocks the release. The Systalink server pulls them (R2).
  images:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, realtime, migrate, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # "main" follows the branch; the commit SHA lets the server roll back to a known version.
          tags: |
            ghcr.io/${{ github.repository_owner }}/kabad-${{ matrix.target }}:main
            ghcr.io/${{ github.repository_owner }}/kabad-${{ matrix.target }}:${{ github.sha }}
          # Public addresses read by the browser, fixed at build time (repository variables, Settings > Variables).
          build-args: |
            NEXT_PUBLIC_REALTIME_URL=${{ vars.NEXT_PUBLIC_REALTIME_URL || 'https://rt.kabad.app' }}
            NEXT_PUBLIC_SALONS=off
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
